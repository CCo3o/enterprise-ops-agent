services:
  - type: web
    name: enterprise-ops-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: local
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: API_KEY
        sync: false
