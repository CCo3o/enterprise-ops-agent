services:
  - type: web
    name: enterprise-ops-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: deepseek
      - key: MODEL_NAME
        value: deepseek-chat
      - key: MODEL_BASE_URL
        value: https://api.deepseek.com
      - key: EMBEDDING_MODEL
        value: ''
      - key: API_KEY
        sync: false
